<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lanternbound</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Silkscreen&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="plates" class="hidden"></div>
    <div id="world-ui"></div>
    <div id="hud" class="hidden"></div>
    <div id="lobby" class="hidden"></div>
    <div id="modal" class="hidden"></div>
    <div id="toast"></div>

    <div id="title">
      <div class="title-inner">
        <div class="logo">
          <div class="logo-top">A Co-op Tale of the Endless Night</div>
          <h1>Lanternbound</h1>
          <div class="logo-rule"><span></span>&#10070;<span></span></div>
        </div>
        <div class="title-form panel">
          <label>Name <input id="name" maxlength="14" placeholder="Traveler" autocomplete="off" /></label>
          <label>Camp <input id="room" maxlength="8" placeholder="CAMP" autocomplete="off" /></label>
          <button id="play" class="btn primary">Begin the Journey</button>
        </div>
        <div id="titlepads" class="title-hint">Press <b>Enter</b> or <b>A</b> on a controller &middot; 1-6 players &middot; share the camp code with friends</div>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
